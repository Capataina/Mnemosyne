# Cargo workspace root for the Mnemosyne monorepo.
#
# Two members today:
#   - crates/engine  — Mnemosyne, the media-agnostic catalogue + retrieval core
#   - src-tauri      — Lynceus, the image-browser product (Tauri app crate)
#
# Future asset-browser products (Syrinx for audio, Daedalus for 3D) join as
# additional member crates that also depend on the engine. The engine is a
# path dependency with no frozen public API until a second product proves the
# seams, so it is versioned and evolved in lock-step with its consumers.
[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]
