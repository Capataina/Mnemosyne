<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2880px; height:1800px; overflow:hidden; }
  body {
    position:relative;
    background:#0a0d11;
    font-family:-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* ── atmospheric background ─────────────────────────────── */
  .glow {
    position:absolute; inset:0;
    background:
      radial-gradient(1100px 900px at 1250px 1150px, rgba(126,186,206,0.17), transparent 70%),
      radial-gradient(1400px 1000px at 2450px 250px,  rgba(126,186,206,0.10), transparent 70%),
      radial-gradient(1200px 900px at 150px 300px,    rgba(56,96,122,0.14),  transparent 70%),
      radial-gradient(900px 700px at 2700px 1700px,   rgba(90,150,170,0.08), transparent 70%);
  }
  /* giant outlined power-symbol watermark — the "unplug" key */
  .watermark { position:absolute; inset:0; }
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(1800px 1300px at 45% 48%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .grain {
    position:absolute; inset:0; opacity:0.055; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* ── the app window ─────────────────────────────────────── */
  .window {
    position:absolute; left:-480px; top:210px;
    width:2200px; height:1381px;
    border-radius:24px; overflow:hidden;
    box-shadow:0 70px 160px rgba(0,0,0,0.72), 0 20px 50px rgba(0,0,0,0.55);
    outline:1px solid rgba(255,255,255,0.09);
  }
  .window img { display:block; width:2200px; height:auto; }

  /* ── copy block ─────────────────────────────────────────── */
  .copy { position:absolute; left:1800px; top:290px; width:1020px; }
  .eyebrow {
    font-size:27px; font-weight:700; letter-spacing:0.38em;
    color:#7ebace; text-transform:uppercase; margin-bottom:38px;
  }
  h1 {
    font-size:106px; font-weight:800; line-height:1.04;
    letter-spacing:-0.022em; color:#fbfdfe;
  }
  h1 .accent { color:#7ebace; }
  .body {
    margin-top:46px; font-size:31px; line-height:1.5; font-weight:400;
    color:rgba(232,239,243,0.74); max-width:920px;
  }

  /* ── zoom-inset lens ────────────────────────────────────── */
  .lens {
    position:absolute; left:1770px; top:1130px;
    width:860px; height:196px;
    border-radius:24px; border:2px solid rgba(126,186,206,0.75);
    background-color:#101418;
    background-image:url("file:///Users/atacanercetinkaya/Code/Mnemosyne/Lynceus%20Pics/06-settings-library-index.png");
    background-size:3326px auto;
    background-position:-2405px -1286px;
    box-shadow:0 40px 90px rgba(0,0,0,0.65), 0 0 60px rgba(126,186,206,0.12);
  }
  svg.connector { position:absolute; inset:0; width:2880px; height:1800px; pointer-events:none; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="watermark" width="2880" height="1800" viewBox="0 0 2880 1800">
    <!-- oversized power symbol, outlined, 4% opacity -->
    <g stroke="#7ebace" stroke-opacity="0.05" stroke-width="26" fill="none" stroke-linecap="round">
      <path d="M 1985 -155 A 620 620 0 1 0 2455 -155"/>
      <line x1="2220" y1="-120" x2="2220" y2="330"/>
    </g>
    <!-- faint diagonal hairlines lower-left -->
    <g stroke="#7ebace" stroke-opacity="0.035" stroke-width="2">
      <line x1="-100" y1="1900" x2="700" y2="1100"/>
      <line x1="60" y1="1900" x2="860" y2="1100"/>
      <line x1="220" y1="1900" x2="1020" y2="1100"/>
    </g>
  </svg>

  <div class="window">
    <img src="file:///Users/atacanercetinkaya/Code/Mnemosyne/Lynceus%20Pics/06-settings-library-index.png" alt="">
  </div>

  <div class="vignette"></div>

  <div class="copy">
    <div class="eyebrow">Private by Architecture</div>
    <h1>Unplug the internet.<br><span class="accent">Nothing changes.</span></h1>
    <p class="body">Three neural encoders index every image entirely on your Mac — no cloud, no account, no upload. The app ships without a network entitlement, so nothing can leave even if it tried.</p>
  </div>

  <div class="lens"></div>
  <svg class="connector" viewBox="0 0 2880 1800">
    <line x1="1770" y1="1228" x2="1412" y2="1128" stroke="#7ebace" stroke-width="2"/>
    <circle cx="1412" cy="1128" r="8" fill="none" stroke="#7ebace" stroke-width="2"/>
    <circle cx="1770" cy="1228" r="5" fill="#7ebace"/>
  </svg>

  <div class="grain"></div>
</body>
</html>
