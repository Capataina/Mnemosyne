[package]
name = "mnemosyne"
version = "0.4.0"
description = "Mnemosyne — media-agnostic catalogue + embedding-retrieval engine shared across the asset-browser products in this monorepo."
edition = "2021"

[lib]
name = "mnemosyne"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17.1"
bincode = "1.3"
bytemuck = "1.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
dirs = "6"
rand = "0.9.2"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.27.0"
