[package]
name = "mnemosyne"
version = "0.5.4"
description = "Mnemosyne — media-agnostic catalogue + embedding-retrieval engine shared across the asset-browser products in this monorepo."
edition = "2021"

[lib]
name = "mnemosyne"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17.1"
bincode = "1.3"
bytemuck = "1.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
dirs = "6"
rand = "0.9.2"
rayon = "1.10"
# T3-2/#8+#20 — mmap-backed flat embedding store. Maps each encoder's
# persisted store zero-copy so a warm launch pages embeddings in on
# demand (clean, file-backed, OS-evictable) instead of faulting +
# copying the whole ~800 MB block up front. Pre-authorised for this task.
memmap2 = "0.9"
# Full-content hashing for move/rename relink detection — a file that
# moves on disk is matched back to its orphaned DB row by BLAKE3 hash so
# its tags/placement/embeddings survive the move (db/content_hash.rs).
blake3 = "1"

[dev-dependencies]
tempfile = "3.27.0"
# Test-only: the code-health-audit proof suites (tests/cha_b_*.rs) open a
# sibling connection to file-backed fixture DBs to run raw comparison SQL
# (COUNT(*) equivalents, WAL measurements) that the public ImageDatabase
# surface deliberately does not expose. Same version/features as the main
# dependency, so no second SQLite build enters the tree.
rusqlite = { version = "0.37.0", features = ["bundled"] }
